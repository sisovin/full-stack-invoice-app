version: '3.8'

services:
  redis:
    image: 'redis:alpine'
    container_name: 'redis'
    ports:
      - '6379:6379'
    networks:
      - backend

  postgres:
    image: 'postgres:alpine'
    container_name: 'postgres'
    environment:
      POSTGRES_USER: 'your_postgres_user'
      POSTGRES_PASSWORD: 'your_postgres_password'
      POSTGRES_DB: 'your_postgres_db'
    ports:
      - '5432:5432'
    networks:
      - backend

networks:
  backend:
    driver: bridge
